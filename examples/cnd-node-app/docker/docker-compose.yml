services:
  app:
    image: ghcr.io/${GH_OWNER}/${REPO_NAME}:${IMAGE_TAG}
    container_name: ${REPO_NAME}
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - '${CONTAINER_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
