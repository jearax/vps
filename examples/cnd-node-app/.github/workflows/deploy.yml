name: Deployment

on:
  push:
    branches:
      - develop
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_NAME: ${{ github.event.repository.name }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  PROJECTS_DIR: 'projects' # Replace with your projects directory
  SSH_GITHUB_HOST_ALIAS: 'ci' # Replace with your github SSH host alias

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    if: ${{ contains(github.event.head_commit.message, format('deploy to {0} - ', github.ref_name)) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install envsubst
        run: |
          sudo apt update
          sudo apt install -y gettext-base

      - name: Prepare application environment file on runner
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          envsubst < .env.template > .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update repository on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts

            cd /home/${{ secrets.VPS_USERNAME }}/${{ env.PROJECTS_DIR }} || exit 1

            if [ -d ${{ env.REPO_NAME }}/.git ]; then
              cd ${{ env.REPO_NAME }}
              git fetch --prune origin ${{ github.ref_name }} >/dev/null 2>&1
              git reset --hard origin/${{ github.ref_name }} >/dev/null 2>&1
              git branch -D ${{ github.ref_name }} 2>/dev/null || true
              git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }} 2>/dev/null || true
            else
              git clone -b ${{ github.ref_name }} git@github.com-${{ env.SSH_GITHUB_HOST_ALIAS }}:${{ github.repository_owner }}/${{ env.REPO_NAME }}.git ${{ env.REPO_NAME }} || exit 1
              cd ${{ env.REPO_NAME }}
              git config pull.rebase false
              git config user.name "${{ github.actor }}"
              git config user.email "${{ github.actor }}@users.noreply.github.com"
            fi

      - name: Copy application environment file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.env'
          target: '/home/${{ secrets.VPS_USERNAME }}/${{ env.PROJECTS_DIR }}/${{ env.REPO_NAME }}'
          # You might very likely need these 2 flags (to strip parent directory and clean up target before copy)
          # strip_components: 1
          # rm: true

      - name: Start Docker containers
        uses: appleboy/ssh-action@master
        env:
          CONTAINER_PORT: ${{ secrets.CONTAINER_PORT }}
          GH_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.ref_name }}
          REPO_NAME: ${{ env.REPO_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CONTAINER_PORT,GH_OWNER,IMAGE_TAG,REPO_NAME
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/${{ env.PROJECTS_DIR }}/${{ env.REPO_NAME }} || exit 1

            chmod 600 .env

            docker compose -f docker/docker-compose.yml -p ${{ env.REPO_NAME }} pull
            docker compose -f docker/docker-compose.yml -p ${{ env.REPO_NAME }} up -d --remove-orphans
            docker compose -f docker/docker-compose.yml -p ${{ env.REPO_NAME }} down --remove-orphans
